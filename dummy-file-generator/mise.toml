min_version = "2026.9.18"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[vars]
runtime_env = "local"

[env]
APP_ENV = "{{ vars.runtime_env }}"

[tools]
node = "24.19.0"

[tasks.default]
description = "Default task (runs dev)"
depends = ["dev"]

[tasks.setup]
alias = "s"
description = "Install dependencies"
depends = ["install"]

[tasks."install"]
description = "Install dependencies from the lockfile"
alias = "i"
run = "npm ci --include=dev"

[tasks."dev"]
description = "Run the application"
alias = "d"
depends = ["guard:local"]
run = "npm run dev"

[tasks."start"]
description = "Start the application"
alias = "st"
depends = ["guard:local"]
run = "npm run start"

[tasks.test]
alias = "te"
description = "Run tests"
run = "npm run test"

[tasks.lint]
alias = "l"
description = "Run lint checks"
run = "npm run lint"

[tasks.typecheck]
alias = "tc"
description = "Run TypeScript type checks"
run = "npm run typecheck"

[tasks.build]
alias = "b"
description = "Build the application"
run = "npm run build"

[tasks.test-e2e]
description = "Run Playwright end-to-end tests"
# 프로덕션 빌드 산출물로 검사한다. build 와 병렬로 돌면 .next 를 두고
# next build 가 충돌하므로 의존을 걸어 순서를 강제한다.
depends = ["build"]
run = "npm run test:e2e"

[tasks.check]
alias = "c"
description = "Run the full local verification suite"
depends = ["test", "lint", "typecheck", "build", "test-e2e"]

[tasks."bootstrap"]
description = "Install locked tools and project dependencies; do not start services"
run = "mise install --locked node@24.19.0\nmise run install"

[tasks."config:check"]
description = "Validate task references without starting applications"
run = "mise tasks validate --errors-only"

[tasks."verify"]
description = "Run the repository quality gate"
run = "mise run check"

[tasks."ci"]
description = "Run the repository quality gate"
run = "mise run verify"

[tasks."guard:local"]
description = "Reject local services under a production environment"
hide = true
run = "case \"$APP_ENV\" in local|dev|development) ;; *) echo 'Local services require the default or dev environment' >&2; exit 1 ;; esac"
