min_version = "2026.9.18"

[settings]
lockfile = false

[vars]
runtime_env = "local"
vite_mode = "production"

[env]
APP_ENV = "{{ vars.runtime_env }}"

[tools]
node = "24.19.0"

[tasks.default]
description = "Default task (runs dev)"
depends = ["dev"]

[tasks.setup]
alias = "s"
description = "Install dependencies"
depends = ["install"]

[tasks."install"]
description = "Install dependencies from the lockfile"
alias = "i"
run = "npm ci --include=dev"

[tasks."dev"]
description = "Run the application"
alias = "d"
depends = ["guard:local"]
run = "npm run dev"

[tasks.test]
alias = "te"
description = "Run unit tests"
run = "npm run test"

[tasks.test-e2e]
alias = "e2e"
description = "Run Chromium end-to-end tests"
run = "npm run test:e2e"

[tasks.lint]
alias = "l"
description = "Run lint checks"
run = "npm run lint"

[tasks.typecheck]
alias = "tc"
description = "Run TypeScript type checks"
run = "npm run typecheck"

[tasks."build"]
description = "Build the application"
alias = "b"
run = "npm run build -- --mode {{ vars.vite_mode | quote }}"

[tasks."preview"]
description = "Preview the production build"
alias = "p"
depends = ["guard:local"]
run = "npm run preview"

[tasks.check]
alias = "c"
description = "Run the full local verification suite"
depends = ["test", "lint", "typecheck", "build", "test-e2e"]

[tasks."bootstrap"]
description = "Install pinned tools and project dependencies; do not start services"
run = "mise install node@24.19.0\nmise run install"

[tasks."config:check"]
description = "Validate task references without starting applications"
run = "mise tasks validate --errors-only"

[tasks."verify"]
description = "Run the repository quality gate"
run = "mise run check"

[tasks."ci"]
description = "Run the repository quality gate"
run = "mise run verify"

[tasks."guard:local"]
description = "Reject local services under a production environment"
hide = true
run = "case \"$APP_ENV\" in local|dev|development) ;; *) echo 'Local services require the default or dev environment' >&2; exit 1 ;; esac"
