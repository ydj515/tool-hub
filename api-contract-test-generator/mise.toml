[tools]
node = "24.13.0"

[tasks.default]
description = "Default task (runs dev)"
depends = ["dev"]

[tasks.setup]
alias = "s"
description = "Install dependencies"
depends = ["install"]

[tasks.install]
alias = "i"
description = "Install dependencies from the lockfile"
run = "npm ci"

[tasks.dev]
alias = "d"
description = "Run the application"
run = "npm run dev"

[tasks.test]
run = "npm run test"

[tasks.lint]
run = "npm run lint"

[tasks.typecheck]
run = "npm run typecheck"

[tasks.build]
run = "npm run build"

[tasks.e2e]
run = "npm run test:e2e"

[tasks.check]
alias = "c"
description = "Run the full local verification suite"
depends = ["test", "lint", "typecheck", "build", "e2e"]
