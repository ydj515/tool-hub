<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:attr="lang=${#locale.language}"
      th:fragment="page(titleKey, content, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (function () {
            const stored = localStorage.getItem('cdg-theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = stored ?? (systemDark ? 'dark' : 'light');
        }());
    </script>
    <title th:text="${#messages.msg(titleKey)}">Class Diagram Generator</title>
    <link rel="icon" href="/favicon.ico" th:href="@{/favicon.ico}">
    <link rel="stylesheet" href="/webjars/bootstrap/dist/css/bootstrap.min.css" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/font/bootstrap-icons.css" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <!-- ds-*.css 는 packages/design-system 의 생성물이다. 직접 편집하지 말고
         정본을 고친 뒤 저장소 루트에서 `npm run tokens:sync` 를 실행한다.
         link 순서 = 캐스케이드 순서이고, mmu/tokens.css 가 --mmu-* 별칭을 잇는다. -->
    <link rel="stylesheet" href="/css/ds/ds-tokens.css" th:href="@{/css/ds/ds-tokens.css}">
    <link rel="stylesheet" href="/css/ds/ds-base.css" th:href="@{/css/ds/ds-base.css}">
    <link rel="stylesheet" href="/css/mmu/tokens.css" th:href="@{/css/mmu/tokens.css}">
    <link rel="stylesheet" href="/css/mmu/components.css" th:href="@{/css/mmu/components.css}">
    <link rel="stylesheet" href="/css/app.css" th:href="@{/css/app.css}">
    <link rel="stylesheet" href="/css/workbench.css" th:href="@{/css/workbench.css}">
</head>
<body class="mmu-body">
<nav class="navbar navbar-expand mmu-topbar app-navbar">
    <div class="container">
        <a class="navbar-brand" href="https://tool-hub-rho.vercel.app/"><i class="bi bi-arrow-left" aria-hidden="true"></i> Tool Hub</a>
        <span class="mmu-page-context">Class Diagram Generator</span>
        <div class="mmu-toolbar">
            <div class="lang-toggle" role="group" aria-label="Locale selector">
                <a
                    href="?lang=ko"
                    class="lang-toggle__option"
                    data-lang-option="ko"
                    th:attr="data-active=${#locale.language == 'ko'}"
                    th:classappend="${#locale.language == 'ko'} ? ' is-active' : ''">KO</a>
                <a
                    href="?lang=en"
                    class="lang-toggle__option"
                    data-lang-option="en"
                    th:attr="data-active=${#locale.language == 'en'}"
                    th:classappend="${#locale.language == 'en'} ? ' is-active' : ''">EN</a>
            </div>
            <button
                type="button"
                class="mmu-theme-toggle"
                data-theme-toggle
                th:attr="data-theme-label-light=#{page.theme.light},data-theme-label-dark=#{page.theme.dark}">
                <!-- Moon/Sun from the shared lucide-react 1.14.0 icon set. -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon theme-icon--moon" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon theme-icon--sun" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
            </button>
        </div>
    </div>
</nav>
<nav class="workflow-nav" aria-label="Workflow">
    <a href="/" th:classappend="${titleKey == 'page.upload.title'} ? ' is-current' : ''" th:text="#{page.workflow.upload}">ZIP 업로드</a>
    <span th:classappend="${titleKey == 'page.progress.title'} ? ' is-current' : ''" th:text="#{page.workflow.analysis}">분석</span>
    <span th:classappend="${titleKey == 'page.result.title'} ? ' is-current' : ''" th:text="#{page.workflow.result}">결과</span>
</nav>
<main class="container mmu-shell">
    <th:block th:replace="${content}"></th:block>
</main>
<script src="/webjars/bootstrap/dist/js/bootstrap.bundle.min.js" th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
<script src="/js/theme.js" th:src="@{/js/theme.js}"></script>
<th:block th:replace="${scripts}"></th:block>
</body>
</html>
