<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/layout :: page('page.upload.title', ~{::content}, ~{::scripts})}">
<body>
<th:block th:fragment="content">
    <section class="mmu-hero-card mmu-page-hero upload-introduction">
        <h1 class="page-title" th:text="#{page.upload.workflowTitle}">소스에서 클래스 설계서 만들기</h1>
        <p class="mmu-hero-copy" th:text="#{page.upload.workflowLead}">
            ZIP 파일을 선택하고 필요한 산출물을 설정하세요.
        </p>
    </section>
    <form id="uploadForm" class="upload-workflow" enctype="multipart/form-data">
        <div class="mmu-surface-card upload-source-card">
            <section data-upload-section="source" aria-labelledby="source-heading">
                <div class="mmu-section-heading">
                    <h2 id="source-heading" th:text="#{page.upload.sourceFile}">소스 파일</h2>
                    <p th:text="#{page.upload.sourceHelp}">분석할 Java·Kotlin 소스가 포함된 ZIP 파일을 업로드하세요.</p>
                </div>
                <label
                    class="file-dropzone upload-file-picker"
                    for="fileInput"
                    data-upload-dropzone
                    tabindex="0">
                    <input
                        id="fileInput"
                        type="file"
                        class="visually-hidden"
                        name="file"
                        accept=".zip"
                        required
                        data-upload-input
                        th:attr="data-invalid-type-message=#{page.upload.dropzone.invalid}">
                    <span class="file-dropzone__body" data-dropzone-default>
                        <i class="bi bi-cloud-arrow-up file-dropzone__icon" aria-hidden="true"></i>
                        <span class="file-dropzone__title" th:text="#{page.upload.dropzone.title}">ZIP 파일을 드래그하거나 클릭해서 선택하세요</span>
                        <span class="file-dropzone__hint" th:text="#{page.upload.dropzone.hint}">.zip 파일만 업로드할 수 있습니다</span>
                    </span>
                    <span class="file-dropzone__success" data-dropzone-selected>
                        <button
                            type="button"
                            class="file-dropzone__remove"
                            data-upload-remove
                            th:attr="aria-label=#{page.upload.dropzone.remove}, title=#{page.upload.dropzone.remove}">
                            <i class="bi bi-x-lg" aria-hidden="true"></i>
                        </button>
                        <i class="bi bi-file-earmark-zip file-dropzone__success-icon" aria-hidden="true"></i>
                        <span class="visually-hidden" th:text="#{page.upload.dropzone.selected}">파일이 첨부되었습니다</span>
                        <span class="file-dropzone__meta">
                            <span
                                class="file-dropzone__filename-strong"
                                data-upload-filename
                                th:attr="data-empty-label=#{page.upload.dropzone.empty}"></span>
                            <span class="file-dropzone__dot" aria-hidden="true">·</span>
                            <span class="file-dropzone__size" data-upload-size></span>
                        </span>
                        <button
                            type="button"
                            class="btn btn-outline-primary btn-sm file-dropzone__change"
                            data-upload-change
                            th:text="#{page.upload.dropzone.change}">다른 파일 선택</button>
                    </span>
                </label>
            </section>
            <section class="upload-document-info" data-upload-section="project" aria-labelledby="document-heading">
                <div class="mmu-section-heading">
                    <h2 id="document-heading" th:text="#{page.upload.documentInfo}">문서 정보</h2>
                    <p th:text="#{page.upload.documentInfo.help}">생성할 문서의 기본 정보를 설정합니다.</p>
                </div>
                <div class="mmu-form-grid">
                    <div class="mmu-field">
                        <label class="form-label" for="programName" th:text="#{page.upload.programName}">프로그램명</label>
                        <input id="programName" class="form-control" name="programName" aria-describedby="programNameHelp" required pattern="^[A-Za-z0-9_\-]+$" maxlength="64" autocomplete="off">
                    </div>
                    <div class="mmu-field">
                        <label class="form-label" for="version" th:text="#{page.upload.version}">버전</label>
                        <input id="version" class="form-control" name="version" required pattern="^[A-Za-z0-9._\-]+$" maxlength="32" value="v1.0">
                    </div>
                    <div class="mmu-field">
                        <label class="form-label" for="language" th:text="#{page.upload.language}">산출물 언어</label>
                        <select id="language" class="form-select" name="language">
                            <option value="ko" th:selected="${#locale.language == 'ko'}">한국어</option>
                            <option value="en" th:selected="${#locale.language == 'en'}">English</option>
                        </select>
                    </div>
                </div>
                <p id="programNameHelp" class="upload-field-help" th:text="#{page.upload.programName.help}">영문, 숫자, 하이픈, 밑줄만 사용할 수 있습니다.</p>
            </section>
        </div>
        <section class="mmu-surface-card upload-output-card" data-upload-section="options" aria-labelledby="outputs-heading">
            <div class="mmu-section-heading">
                <h2 id="outputs-heading" th:text="#{page.upload.outputs}">생성할 산출물</h2>
                <p th:text="#{page.upload.outputs.help}">분석 후 생성할 문서 형식을 선택하세요.</p>
            </div>
            <div class="upload-format-list">
                <label class="upload-format-option" for="format-docx">
                    <input id="format-docx" type="checkbox" class="form-check-input" name="formats" value="docx" checked>
                    <strong>DOCX</strong><span th:text="#{page.upload.format.docx.description}">Word 문서 (Microsoft Word)</span>
                </label>
                <label class="upload-format-option" for="format-xlsx">
                    <input id="format-xlsx" type="checkbox" class="form-check-input" name="formats" value="xlsx" checked>
                    <strong>XLSX</strong><span th:text="#{page.upload.format.xlsx.description}">Excel 문서 (Microsoft Excel)</span>
                </label>
                <label class="upload-format-option" for="format-md">
                    <input id="format-md" type="checkbox" class="form-check-input" name="formats" value="md" checked>
                    <strong>MD</strong><span th:text="#{page.upload.format.md.description}">Markdown 문서</span>
                </label>
            </div>
            <div class="upload-diagram-option">
                <input class="form-check-input" type="checkbox" name="includeDiagrams" id="includeDiagrams" value="true" checked>
                <label class="form-check-label" for="includeDiagrams" th:text="#{page.upload.includeDiagrams}">클래스 다이어그램 포함</label>
            </div>
        </section>
        <footer class="upload-submit-row">
            <p class="mmu-action-hint" data-upload-action-hint><i class="bi bi-info-circle" aria-hidden="true"></i><span th:text="#{page.upload.serverNotice}">ZIP 파일은 분석 서버에서 처리됩니다.</span></p>
            <button type="submit" class="btn btn-primary" th:text="#{page.upload.startAnalysis}">분석 시작</button>
        </footer>
    </form>
</th:block>
<th:block th:fragment="scripts">
    <script src="/js/upload.js" th:src="@{/js/upload.js}"></script>
</th:block>
</body>
</html>
