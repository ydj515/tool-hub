<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/layout :: page('page.result.title', ~{::content}, ~{::scripts})}">
<body>
<th:block th:fragment="content">
    <section class="mmu-hero-card result-summary">
        <div class="d-flex flex-column flex-lg-row justify-content-between align-items-start gap-3">
            <div>
                <p class="mmu-eyebrow" th:text="#{page.result.section}">Result</p>
                <h1 class="page-title" th:text="#{page.result.heading}">클래스 설계서가 준비되었습니다</h1>
                <p class="workflow-result-context" th:if="${jobContext != null}" th:text="${jobContext.programName + ' · ' + jobContext.version + ' · ' + jobContext.language}"></p>
                <p class="workflow-result-count" id="resultCount" aria-live="polite"></p>
                <p class="mmu-hero-copy" th:text="#{page.result.lead}">
                    생성된 산출물을 검토하고 묶음 또는 개별 다운로드를 진행할 수 있습니다.
                </p>
            </div>
            <div class="result-actions">
                <a href="/" class="btn btn-outline-primary btn-with-icon" th:text="#{page.result.another}">다른 프로젝트 분석</a>
                <a id="bundleBtn" class="btn btn-primary btn-with-icon" th:text="#{page.result.bundle}">묶음 다운로드</a>
            </div>
        </div>
    </section>
    <section id="resultWarnings" class="mmu-surface-card mt-4" hidden>
        <h2 class="mmu-section-title" th:text="#{page.result.warningTitle}">주의 사항</h2>
        <div id="resultWarningsList" class="mmu-warning-stack mt-3"></div>
    </section>
    <section class="mmu-surface-card artifact-section mt-4">
        <div class="artifact-heading" aria-hidden="true">
            <span th:text="#{page.result.artifacts}">산출물</span>
            <span th:text="#{page.result.format}">형식</span>
            <span th:text="#{page.result.size}">크기</span>
            <span th:text="#{page.result.download}">다운로드</span>
        </div>
        <div
            class="visually-hidden"
            th:text="|#{page.result.module} · #{page.result.format} · #{page.result.filename} · #{page.result.size}|"></div>
        <div id="artifacts" class="artifact-grid" role="list"></div>
    </section>
    <section class="workflow-result-details">
        <p class="workflow-source" th:if="${jobContext != null and jobContext.sourceFilename != null}"><strong th:text="#{page.result.input}"></strong> <span th:text="${jobContext.sourceFilename}"></span><span th:if="${jobContext.sourceSizeLabel != null}" th:text="${' · ' + jobContext.sourceSizeLabel}"></span></p>
        <details class="result-details mt-4">
            <summary th:text="#{page.result.formatDownloads}">형식별 다운로드</summary>
            <div id="formatDownloads" class="d-flex flex-wrap gap-2 mt-3"></div>
        </details>
        <dl class="workflow-result-metadata">
            <div><dt th:text="#{page.result.createdAt}">생성 시각</dt><dd id="createdAt">-</dd></div>
            <div><dt th:text="#{page.result.expiresAt}">만료</dt><dd id="expiresAt">-</dd></div>
            <div><dt th:text="#{page.result.artifacts}">산출물</dt><dd id="artifactCount">0</dd></div>
        </dl>
    </section>
</th:block>
<th:block th:fragment="scripts">
    <script th:inline="javascript">
        window.__jobId = /*[[${jobId}]]*/ '';
        window.__resultLocale = /*[[${#locale.toLanguageTag()}]]*/ 'ko-KR';
        window.__resultLabels = {
            download: /*[[#{page.result.download}]]*/ 'Download',
            documentTitle: /*[[#{page.result.document}]]*/ 'Class design document',
            generated: /*[[#{page.result.generated}]]*/ 'Generated files',
            loadError: /*[[#{page.result.loadError}]]*/ 'Failed to load result',
            formatDownloadsTitle: /*[[#{page.result.formatDownloads}]]*/ 'Format Downloads',
            archiveHint: /*[[#{page.result.archiveHint}]]*/ 'ZIP',
            directHint: /*[[#{page.result.directHint}]]*/ 'File'
        };
    </script>
    <script src="/js/result.js" th:src="@{/js/result.js}"></script>
</th:block>
</body>
</html>
