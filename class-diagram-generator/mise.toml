min_version = "2026.9.18"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[vars]
runtime_env = "local"

[env]
APP_ENV = "{{ vars.runtime_env }}"

[tools]
java = "21.0.2"

# 사용법:
#   mise run            -> default task (check)
#   mise run <task>     -> 명시적 실행
#   mise tasks          -> 정의된 task 목록 확인

[tasks.default]
description = "기본 task: 전체 검증 (check)"
depends = ["check"]

[tasks."dev"]
description = "Spring Boot 앱 기동 (http://localhost:8080)"
depends = ["guard:local"]
run = "./gradlew bootRun"

[tasks.build]
description = "Jar 빌드 + 테스트"
run = "./gradlew build"

[tasks.test]
description = "테스트 실행 (Kotest)"
run = "./gradlew test"

[tasks.check]
description = "전체 검증: 테스트 + Spotless + Detekt"
run = "./gradlew check"

[tasks.format]
description = "Spotless(ktlint)로 코드 자동 포맷"
run = "./gradlew spotlessApply"

[tasks.lint]
description = "Detekt 정적 분석"
run = "./gradlew detekt"

[tasks.clean]
description = "Gradle 빌드 캐시 정리"
run = "./gradlew clean"

[tasks."clean-check"]
description = "clean 후 전체 검증 (CI 용도)"
run = "./gradlew clean check"

[tasks."bootstrap"]
description = "Install locked tools and project dependencies; do not start services"
run = "mise install --locked java@21.0.2\n./gradlew --version"

[tasks."config:check"]
description = "Validate task references without starting applications"
run = "mise tasks validate --errors-only"

[tasks."verify"]
description = "Run the repository quality gate"
run = "mise run check"

[tasks."ci"]
description = "Run the repository quality gate"
run = "mise run verify"

[tasks."guard:local"]
description = "Reject local services under a production environment"
hide = true
run = "case \"$APP_ENV\" in local|dev|development) ;; *) echo 'Local services require the default or dev environment' >&2; exit 1 ;; esac"
